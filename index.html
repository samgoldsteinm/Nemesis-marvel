<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0608" />
<title>Breakline</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BREAKLINE" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="application-name" content="BREAKLINE" />
<style>
  @font-face { font-family: 'Anton'; src: url('fonts/anton-latin-400-normal.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Oswald'; font-weight: 500; src: url('fonts/oswald-latin-500-normal.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Oswald'; font-weight: 700; src: url('fonts/oswald-latin-700-normal.woff2') format('woff2'); font-display: swap; }
  :root {
    --ink: #f4efe6;
    --dim: #a89fb4;
    --panel: rgba(14, 10, 20, 0.86);
    --edge: #3a2c48;
    --hot: #ff3b4e;
    --hot2: #b8142c;
    --hotdk: #5a0c18;
    --display: 'Anton', Impact, 'Arial Narrow Bold', sans-serif;
    --cond: 'Oswald', 'Arial Narrow', system-ui, sans-serif;
    --p1: #3aa0ff;
    --p2: #ff4a4a;
    --hp: #b4202a;
    --st: #ffd34a;
    --en: #47b8ff;
    --rg: #ff4a1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0710; color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #app canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  #tint { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; background: radial-gradient(ellipse at center, rgba(255,80,20,0.05) 30%, rgba(255,40,0,0.45) 100%); mix-blend-mode: screen; }
  /* ---------------- menus */
  #menu { pointer-events: auto; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(8,6,14,0.55), rgba(8,6,14,0.88)); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #menu.hidden, .hidden { display: none !important; }
  .screen { width: min(1120px, 100% - 32px); max-height: calc(100% - 24px); overflow: auto; padding: 12px 2px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  .logo { font-family: Impact, "Arial Black", sans-serif; font-size: clamp(56px, 12vw, 120px); letter-spacing: 0.03em; line-height: 0.9; margin: 0; color: var(--ink); text-shadow: 0 6px 30px rgba(255,40,70,0.45); }
  .logo span { color: var(--hot); }
  .tagline { color: var(--dim); margin: 12px 0 28px; font-size: 16px; }
  .focus { outline: 3px solid #fff !important; outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* title */
  .foot { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  .pill { padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); font-size: 13px; }
  .pill.static { color: var(--dim); }
  .pill:hover { background: rgba(255,255,255,0.12); }
  /* shared */
  .topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-bottom: 14px; }
  .topbar h2 { margin: 0; text-align: center; font-size: 22px; font-weight: 800; letter-spacing: .02em; }
  .hintline { color: var(--dim); font-size: 14px; }
  .hintline b { color: #fff; }
  .fight.confirm { background: linear-gradient(135deg, #3ac0ff, #2a6ae0); box-shadow: 0 10px 30px rgba(40,140,255,0.35); font-size: 18px; white-space: nowrap; }
  .lockd { color: #7dff9a; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,0.08); color: #ddd; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  kbd { display: inline-block; min-width: 22px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12); border-bottom: 2px solid rgba(0,0,0,0.5); font: 600 12px system-ui; text-align: center; margin: 0 1px; }
  .btn2 { padding: 12px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.07); font-weight: 600; }
  .btn2:hover { background: rgba(255,255,255,0.14); }
  .btn2.primary { background: linear-gradient(135deg, var(--hot), var(--hot2)); border-color: transparent; }
  .btn2.wide { width: 100%; }
  /* fighter select */
  .select-grid { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: 14px; align-items: stretch; }
  .side { position: relative; border-radius: 18px; padding: 14px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, transparent), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; overflow: hidden; }
  .side.active { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 10px 40px color-mix(in srgb, var(--c) 35%, transparent); }
  .side-who { display: flex; justify-content: space-between; align-items: center; }
  .badge { font: 800 12px system-ui; padding: 3px 8px; border-radius: 6px; color: #000; }
  .badge.p0 { background: var(--p1); } .badge.p1 { background: var(--p2); }
  .choosing { font-size: 12px; color: var(--c); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }
  .side-art { position: relative; height: clamp(150px, 30vh, 290px); overflow: hidden; }
  .side-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 12px 18px rgba(0,0,0,0.6)); }
  .side-img.ini, .pimg.ini, .rimg.ini, .mini.ini, .result-img.ini { display: grid; place-items: center; width: 100%; height: 100%; font: 900 64px Impact, sans-serif; color: var(--c); }
  .side-name { font: 900 30px Impact, "Arial Black", sans-serif; letter-spacing: .03em; color: var(--c); margin-top: 6px; }
  .side-title { color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
  .trait { font-size: 12px; line-height: 1.35; color: var(--dim); margin: 6px 0 2px; max-width: 320px; } .trait b { color: var(--c); }
  .stats { margin-top: 10px; display: grid; gap: 6px; }
  .stat { display: grid; grid-template-columns: 82px 1fr; align-items: center; font-size: 12px; color: #ccc; }
  .stat i { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .stat b { height: 7px; border-radius: 3px; background: rgba(255,255,255,0.1); }
  .stat b.on { background: var(--c); }
  .roster { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-content: start; }
  .rcard { position: relative; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 30%, #111), #0d0b12); padding: 6px 4px 8px; height: clamp(120px, 19vh, 170px); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; overflow: hidden; transition: transform .1s; }
  .rcard:hover, .rcard.focus { transform: translateY(-2px); border-color: var(--c); }
  .rimg { position: absolute; inset: 4px 0 26px; width: 100%; height: calc(100% - 30px); object-fit: contain; object-position: center bottom; }
  .rname { position: relative; font: 900 14px Impact, "Arial Black", sans-serif; letter-spacing: .04em; text-shadow: 0 2px 6px #000; }
  .rtags { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; }
  .rtags i { font: 800 11px system-ui; padding: 2px 6px; border-radius: 5px; color: #000; font-style: normal; }
  .rtags .t1 { background: var(--p1); } .rtags .t2 { background: var(--p2); }
  .rcard.pick1 { box-shadow: inset 0 0 0 2px var(--p1); }
  .rcard.pick2 { box-shadow: inset 0 0 0 2px var(--p2); }
  .rcard.pick1.pick2 { box-shadow: inset 0 0 0 2px var(--p1), inset 0 0 0 4px var(--p2); }
  .blurb { grid-column: 1 / -1; margin: 2px 4px 0; color: #cfc8d8; font-size: 13px; line-height: 1.4; text-align: center; }
  .options { display: flex; flex-wrap: nowrap; align-items: center; gap: 14px 18px; margin-top: 16px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
  .opt { display: flex; align-items: center; gap: 10px; }
  .opt-label { color: var(--dim); font-size: 13px; }
  .seg { display: inline-flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 3px; gap: 3px; }
  .segbtn { padding: 8px 12px; border-radius: 9px; border: 0; background: transparent; font-size: 14px; color: #cfc8d8; display: flex; align-items: center; gap: 8px; }
  .segbtn.on { background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; }
  .arena-sw { width: 22px; height: 16px; border-radius: 4px; display: inline-block; }
  .arena-sw.rooftop { background: linear-gradient(180deg, #6a4a70, #ffc890); }
  .arena-sw.overpass { background: linear-gradient(180deg, #8fb4bc, #3a4a4c); }
  .arena-sw.construction { background: linear-gradient(180deg, #6a3a52, #ffc070); }
  .arena-sw.market { background: linear-gradient(180deg, #0c1e1c, #3ac08a); }
  .arena-sw.archive { background: linear-gradient(180deg, #0e1424, #9ab8ff); }
  .arena-sw.foundry { background: linear-gradient(180deg, #8a7050, #d8b880); }
  .arena-sw.lab { background: linear-gradient(180deg, #0e0a18, #3affd8); }
  .seg .segbtn { white-space: nowrap; }
  @media (max-width: 1180px) and (min-height: 561px) { .options { flex-wrap: wrap; } .fight { margin-left: auto; } }
  .arena-pick { align-items: stretch; }
  .arena-pick .arena-cur { min-width: 150px; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .arena-pick .anum { font-size: 10px; opacity: .6; margin-left: 2px; }
  .arena-pick .arr { padding-left: 8px; padding-right: 8px; }
  .fight { margin-left: auto; white-space: nowrap; padding: 14px 30px; border: 0; border-radius: 14px; background: linear-gradient(135deg, var(--hot), var(--hot2)); font: 900 22px Impact, "Arial Black", sans-serif; letter-spacing: .06em; box-shadow: 0 10px 30px rgba(220,30,60,0.42); }
  /* results */
  .result-screen { display: grid; grid-template-columns: minmax(180px, 34%) 1fr; gap: 24px; align-items: center; }
  .result-art { position: relative; height: min(62vh, 520px); background: radial-gradient(ellipse at 50% 80%, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%); }
  .result-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 16px 24px rgba(0,0,0,0.7)); }
  .kicker { margin: 0; color: var(--c); font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
  .result-big { font: 900 clamp(44px, 8vw, 84px) Impact, "Arial Black", sans-serif; margin: 4px 0; line-height: 1; }
  .sub { color: var(--dim); margin: 0 0 18px; }
  .rstats { display: grid; gap: 8px; margin-bottom: 18px; }
  .rstat { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border-left: 4px solid var(--c); }
  .rstat b { display: block; } .rstat span { color: var(--dim); font-size: 13px; }
  .mini { width: 44px; height: 54px; object-fit: cover; object-position: 50% 10%; border-radius: 8px; background: rgba(0,0,0,0.3); flex: none; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
  /* pause */
  .pause-screen { display: grid; place-items: center; }
  .pause-screen .card { width: min(360px, 100%); display: grid; gap: 10px; padding: 22px; border-radius: 20px; background: rgba(20,16,28,0.9); border: 1px solid rgba(255,255,255,0.1); }
  .pause-screen h2 { margin: 0 0 6px; text-align: center; font-size: 26px; }
  /* how to play */
  .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
  .tab { padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: transparent; font-weight: 600; }
  .tab.on { background: #fff; color: #111; }
  table.ctl { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.ctl th { text-align: left; color: var(--dim); font-weight: 600; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  table.ctl td { padding: 9px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .note { color: var(--dim); font-size: 13px; margin-top: 12px; line-height: 1.6; }
  .tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .tip { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.05); }
  .tip h4 { margin: 0 0 6px; font-size: 15px; } .tip p { margin: 0; color: #cfc8d8; font-size: 13.5px; line-height: 1.55; }
  .fcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
  .fcard { padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.05); border-top: 3px solid var(--c); }
  .fhead { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .fhead b { display: block; color: var(--c); font: 900 18px Impact, sans-serif; letter-spacing: .04em; } .fhead span { color: var(--dim); font-size: 12px; }
  table.mlist { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.mlist td { padding: 4px 4px; vertical-align: top; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ddd; }
  table.mlist td:first-child { color: var(--c); font-weight: 700; white-space: nowrap; }
  /* Short screens (phones in landscape): compact select layout. */
  @media (max-height: 560px) {
    .screen { padding: 6px 2px; }
    .topbar { margin-bottom: 8px; } .topbar h2 { font-size: 18px; }
    .side { padding: 8px 10px; }
    .side-art { height: 26vh; }
    .side-name { font-size: 20px; margin-top: 2px; }
    .chips, .blurb { display: none; }
    .side-title { font-size: 10px; }
    .stats { margin-top: 4px; gap: 2px; }
    .stat { grid-template-columns: 62px 1fr; font-size: 10px; }
    .stat b { height: 5px; }
    .trait { font-size: 10px; line-height: 1.25; margin: 4px 0 0; }
    .side { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; max-height: calc(100vh - 128px - env(safe-area-inset-bottom)); } .side::-webkit-scrollbar { display: none; }
    .side .badge { white-space: nowrap; } .side .choosing { display: none; }
    .side-art { height: 15vh; }
    .rcard { height: 27vh; }
    .options { margin-top: 6px; padding: 6px 8px; gap: 8px; flex-wrap: nowrap; }
    .opt-label, .arena-sw { display: none; }
    .segbtn { padding: 6px 8px; font-size: 12px; }
    .fight { padding: 8px 18px; font-size: 16px; white-space: nowrap; }
    .side-art { height: 17vh; }
    .rcard { height: 25vh; }
    .result-art { height: 70vh; }
    .result-big { font-size: 48px; }
    .logo { font-size: 64px; } .tagline { margin: 6px 0 14px; }
  }
  @media (max-width: 820px) and (orientation: portrait) {
    .select-grid { grid-template-columns: 1fr 1fr; }
    .roster { grid-column: 1 / -1; grid-row: 1; grid-template-columns: repeat(4, 1fr); }
    .rcard { height: 120px; }
    .blurb { display: none; }
    .side-art { height: 140px; }
    .stats { display: none; }
    .result-screen { grid-template-columns: 1fr; }
    .result-art { height: 200px; }
    .options { flex-wrap: wrap; }
    .fight { width: 100%; margin-left: 0; }
  }
  .padopts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0 4px; }
  .padsteps { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; max-width: 520px; }
  .padsteps li { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--dim); }
  .padsteps li b { color: #ddd; } .padsteps li.cur { background: rgba(58,160,255,0.18); outline: 1px solid rgba(58,160,255,0.6); color: #fff; }
  .padsteps li.done span { color: #7dff9a; }

  /* ================= BREAKLINE menu look: red accent, condensed comic type, angled panels ================= */
  #menu { background:
      radial-gradient(ellipse at 50% 120%, rgba(120,10,30,0.35), transparent 60%),
      linear-gradient(180deg, rgba(6,4,8,0.62), rgba(6,4,8,0.92));
    backdrop-filter: blur(3px) saturate(0.85); -webkit-backdrop-filter: blur(3px) saturate(0.85); }
  #menu::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1.4px); background-size: 4px 4px; }
  .screen { position: relative; z-index: 1; }
  .focus { outline: 3px solid var(--hot) !important; outline-offset: 2px; }
  .pill { font-family: var(--cond); font-weight: 500; letter-spacing: .04em; border-radius: 4px; transform: skewX(-8deg); }
  .pill > * { display: inline-block; }
  .pill:hover { border-color: var(--hot); }
  .btn2 { font-family: var(--cond); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; transform: skewX(-8deg); }
  .btn2.primary { box-shadow: 0 8px 24px rgba(220,30,60,0.35); }
  .topbar h2, .sel-h, .paused-h { font-family: var(--display); font-weight: 400; letter-spacing: .05em; text-transform: uppercase; }
  .topbar h2 { font-size: 30px; }
  /* chrome logo */
  .chrome { font-family: var(--display); font-weight: 400; margin: 0; line-height: .9; letter-spacing: .02em; font-size: clamp(64px, 13vw, 168px);
    background: linear-gradient(180deg, #ffffff 0%, #d7dde0 28%, #8b979c 49%, #2a3236 51%, #9aa6ab 62%, #e6ecee 80%, #8d989c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px rgba(0,0,0,0.55);
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.6)) drop-shadow(0 0 24px rgba(160,200,210,0.18)); position: relative; transform: skewX(-6deg); }
  .chrome span { background: linear-gradient(180deg, #ffd3d8 0%, #ff5a6a 30%, #b8142c 50%, #4a0610 52%, #d8203a 66%, #ff8a96 88%, #b8142c 100%); -webkit-background-clip: text; background-clip: text; }
  .chrome::after { content: ''; position: absolute; left: -4%; right: -4%; top: 54%; height: 4px; background: linear-gradient(90deg, transparent, var(--hot) 12%, #fff 50%, var(--hot) 88%, transparent); transform: rotate(-4deg); box-shadow: 0 0 14px var(--hot); }
  .chrome.small { font-size: clamp(44px, 6.2vw, 92px); }
  .chrome-sub { font-family: var(--cond); font-weight: 500; letter-spacing: .45em; font-size: clamp(10px, 1.3vw, 15px); color: #b9c7c9; margin-top: 10px; text-align: center; }
  /* prompts */
  .prompts { display: flex; gap: 14px; justify-content: flex-end; flex-wrap: wrap; font-family: var(--cond); font-weight: 500; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #d8d2da; }
  .prompts span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pk { font-style: normal; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 50%; font: 700 12px system-ui; color: #fff; background: #333; border: 1px solid rgba(255,255,255,0.4); }
  .pk.pad-confirm { background: #1f7a3a; } .pk.pad-back { background: #a52030; } .pk.pad-tab { border-radius: 4px; background: #333; }
  .pk.key { border-radius: 4px; background: rgba(255,255,255,0.14); font-size: 11px; }
  .pk.tap { background: transparent; border: 0; font-size: 16px; }
  /* ---------- Press Start ---------- */
  .start-screen { position: fixed; inset: 0; width: 100%; max-height: none; height: 100%; overflow: hidden; padding: 0; background: #020405; cursor: pointer; display: block; }
  .start-screen .band { position: absolute; left: 0; right: 0; top: 24%; height: 50%; overflow: hidden;
    background: radial-gradient(ellipse at 72% 50%, #1d3a38 0%, #0b1a19 45%, #050b0b 80%);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(180deg, transparent, #000 14%, #000 86%, transparent); }
  .start-screen .smoke { position: absolute; inset: -40%; background: radial-gradient(ellipse at 30% 50%, rgba(120,170,165,0.22), transparent 40%), radial-gradient(ellipse at 70% 40%, rgba(90,140,135,0.18), transparent 38%), radial-gradient(ellipse at 55% 65%, rgba(160,30,50,0.12), transparent 35%); filter: blur(18px); animation: smoke 26s linear infinite; }
  .start-screen .smoke.s2 { animation-duration: 38s; animation-direction: reverse; opacity: .8; }
  .start-screen .smoke.s3 { animation-duration: 52s; opacity: .6; transform: scale(1.3); }
  @keyframes smoke { 0% { transform: translate(-6%, 0) rotate(0deg); } 50% { transform: translate(6%, -3%) rotate(8deg); } 100% { transform: translate(-6%, 0) rotate(0deg); } }
  .start-screen .prof { position: absolute; right: -4%; top: -16%; height: 132%; opacity: .88; mix-blend-mode: screen;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 45%); mask-image: linear-gradient(90deg, transparent 0%, #000 45%); }

  .seam { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

  .select-screen .options { margin-top: 0; border-radius: 0; background: linear-gradient(90deg, rgba(0,0,0,0.5), rgba(255,255,255,0.03)); border: 0; border-left: 4px solid var(--hot); }
  .opt-label { font: 500 12px var(--cond); letter-spacing: .14em; text-transform: uppercase; }

  /* ---------- Results / pause / how to ---------- */
  .result-art { overflow: hidden; clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%); background: none; }

  .fhead b { font-family: var(--display); font-weight: 400; }
  table.ctl th { font-family: var(--cond); letter-spacing: .1em; text-transform: uppercase; }
  .padsteps li.cur { background: rgba(255,59,78,0.18); outline-color: rgba(255,59,78,0.6); }
  /* ---------- responsive ---------- */
  @media (max-width: 980px) {
    .half .info { width: min(30%, 260px); }
    .half .chips { display: none; }
  }
  @media (orientation: landscape) and (max-height: 560px) {
    .start-screen .band { top: 20%; height: 54%; }
    .start-screen .press { top: 82%; }
    /* Short landscape phones: tighter menu so the settings row stays on screen; scroll as a last resort. */
    .pl-long { display: none; }
    .select-screen { gap: 5px; padding: 4px 2px; height: 100%; }
    .sel-top { gap: 8px; } .sel-h { font-size: 20px; } .sel-h small { display: none; } .btn-back { padding: 4px 10px; font-size: 12px; }
    .prompts { font-size: 11px; gap: 8px; } .pk { min-width: 18px; height: 18px; font-size: 10px; }
    .vs { height: calc(100vh - 150px - env(safe-area-inset-bottom)); min-height: 0; }
    .half .info { top: 30px; bottom: 6px; width: min(31%, 250px); padding: 6px 8px; }
    .half .nm { font-size: 24px; } .half .ttl { font-size: 9px; letter-spacing: .14em; }
    .half .stats { gap: 2px; margin-top: 3px; } .half .stat { grid-template-columns: 58px 1fr; font-size: 9px; } .half.h1 .stat { grid-template-columns: 1fr 58px; } .half .stat b { height: 5px; }
    .half .trait { font-size: 10px; line-height: 1.25; margin-top: 3px; }
    .half .tag { top: 6px; font-size: 10px; } .half .badge { font-size: 10px; padding: 2px 6px; }
    .vsmark { font-size: 30px; }
    .strip { gap: 4px; padding: 3px 4px; }
    .th { max-height: 44px; } .th .thn { display: none; }
    .select-screen .options { padding: 4px 8px; }
  }
  @media (orientation: portrait) and (max-width: 700px) {
    .start-screen .chrome { font-size: 19vw; } .start-screen .chrome-sub { letter-spacing: .25em; font-size: 9px; }
    .start-screen .prof { right: -30%; opacity: .5; }
    .select-screen { height: 100%; }
    .vs { height: 50vh; }
    .half.h0 { clip-path: polygon(0 0, 100% 0, 100% 46%, 0 54%); } .half.h1 { clip-path: polygon(0 54%, 100% 46%, 100% 100%, 0 100%); }
    .half.h0 .pose { left: 74%; height: 52%; top: 4px; bottom: auto; } .half.h1 .pose { left: 26%; height: 52%; top: auto; bottom: 0; }
    .half .info { width: 58%; }
    .half.h0 .info { top: 30px; bottom: auto; max-height: 44%; } .half.h1 .info { top: auto; bottom: 8px; max-height: 42%; }
    .half.h1 .tag { top: auto; bottom: 46%; }
    .half .chips, .half .stats { display: none !important; }
    .seam .ls { display: none; } .seam .pt { display: inline; }
    .vsmark { font-size: 32px; }
    .strip { grid-template-columns: repeat(4, 1fr); } .th { max-height: none; }
    .sel-top { grid-template-columns: auto 1fr; } .sel-top .prompts { display: none; }
    .result-screen { grid-template-columns: 1fr; } .result-art { clip-path: none; height: 34vh; }
  }
  /* ---------------- online */
  .online-screen { max-width: 900px; margin: 0 auto; }
  .net-body { padding: 10px 4px; }
  .net-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 10px 0 14px; }
  .net-card { padding: 16px; border-radius: 14px; background: linear-gradient(160deg, rgba(216,32,58,0.14), rgba(255,255,255,0.03)); border: 1px solid var(--edge); display: flex; flex-direction: column; gap: 10px; }
  .net-card h3 { margin: 0; font: 400 24px var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .net-card p { margin: 0; color: var(--dim); font-size: 13px; }
  .net-code-in { font: 900 28px ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; text-align: center; padding: 10px; border-radius: 10px; border: 1px solid var(--edge); background: rgba(0,0,0,0.4); color: #fff; width: 100%; box-sizing: border-box; }
  .net-code { font: 900 clamp(44px, 9vw, 84px) ui-monospace, monospace; letter-spacing: .25em; color: #fff; text-shadow: 0 0 24px rgba(255,59,78,0.55); margin: 4px 0 12px; }

  .net-link input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--edge); background: rgba(0,0,0,0.4); color: #ddd; font-size: 12px; }
  .net-status { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .net-err { color: #ff8a96; font-weight: 700; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c9a23a; box-shadow: 0 0 8px currentColor; display: inline-block; animation: pulse .8s infinite alternate; }
  .dot.ok { background: #3ad66a; animation: none; }
  .net-sel { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); margin: 0 0 6px; padding: 0 6px; }
  #netstat { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(8px, env(safe-area-inset-bottom)); z-index: 22; font: 700 11px system-ui; color: #ddd; background: rgba(8,6,12,0.7); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--edge); pointer-events: none; display: none; }
  #netstat i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #3ad66a; }
  #netstat.ok i { background: #e8c040; } #netstat.bad i { background: #ff3b4e; }
  #netstat b { color: #ffcf6a; }
  /* camera zoom stepper (pause menu, How to play → Controls) */
  .zoomctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .zoomctl .opt-label { font: 700 12px system-ui; letter-spacing: .08em; text-transform: uppercase; color: #bbb; }
  .zoomctl .zbtn { min-height: 40px; min-width: 88px; justify-content: center; }
  .zoomctl .zbtn[disabled] { opacity: .4; }
  .zoomctl .zbar { position: relative; flex: 1 1 80px; max-width: 160px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: visible; }
  .zoomctl .zbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--hot2, #b8142c), var(--hot)); }
  .zoomctl .zbar u { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: rgba(255,255,255,.55); }
  .zoomctl.compact { flex-wrap: nowrap; gap: 6px; }
  .zoomctl.compact .zbtn { min-width: 44px; min-height: 44px; font-size: 20px; padding: 0; }
  .zoomctl .zval { font: 700 14px system-ui; min-width: 44px; text-align: right; color: var(--ink); }
  /* online start-up / stall overlay */
  #netwait { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #netwait.on { display: flex; }
  #netwait.dim { background: radial-gradient(ellipse at center, rgba(11,7,16,.72), rgba(11,7,16,.94)); }
  #netwait .nw-box { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; max-width: min(92vw, 520px); padding: 14px 20px; border-radius: 14px; background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 10px 40px rgba(0,0,0,.5); pointer-events: auto; }
  #netwait .nw-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #netwait b { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
  #netwait small { font: 600 12px system-ui; color: #bbb; }

  @keyframes nwspin { to { transform: rotate(360deg); } }
  #netwait .nw-btns { display: none; gap: 8px; width: 100%; justify-content: center; }
  #netwait.long .nw-btns { display: flex; }
  #netwait .nw-btns .pill { min-height: 40px; min-width: 92px; }
  #netwait .nw-hint { display: none; }
  #netwait.hinted:not(.on) { display: flex; align-items: flex-end; padding-bottom: max(42px, calc(env(safe-area-inset-bottom) + 34px)); }
  #netwait.hinted:not(.on) .nw-box { display: none; }
  #netwait.hinted:not(.on) .nw-hint { display: block; font: 700 13px system-ui; color: #fff; background: rgba(8,6,12,.75); border: 1px solid var(--hot); padding: 6px 14px; border-radius: 999px; animation: nwblink 1.2s ease-in-out infinite alternate; }
  @keyframes nwblink { from { opacity: .55; } to { opacity: 1; } }
  #netdebug { position: fixed; left: 6px; top: 40px; z-index: 40; margin: 0; max-width: 46vw; max-height: 60vh; overflow: hidden; font: 10px/1.3 ui-monospace, Menlo, monospace; color: #9fe; background: rgba(0,0,0,.62); padding: 6px 8px; border-radius: 6px; pointer-events: none; white-space: pre-wrap; }

  /* ================= spacing pass + layout zones (art never overlaps text) ================= */
  :root { --s1: 8px; --s2: 12px; --s3: 16px; --s4: 24px; --s5: 32px; }
  .screen { padding: var(--s3) var(--s2); }
  .topbar { gap: var(--s4); margin-bottom: var(--s4); }
  .topbar > .pill:first-child, .btn-back { margin-right: var(--s1); }
  .tabs { gap: var(--s2); margin-bottom: var(--s4); }
  .row-btns { gap: var(--s2); }
  .foot { gap: var(--s2); }
  .note { margin: var(--s2) 0; }
  .padopts { gap: var(--s2); margin: var(--s3) 0 var(--s2); }
  .padsteps { gap: var(--s1); margin: var(--s3) 0; }
  .tips, .fcards { gap: var(--s3); }
  .tip, .fcard { padding: var(--s3); }
  table.ctl td, table.ctl th { padding: 10px var(--s2); }
  #toast { padding: var(--s2) var(--s3); }
  /* title: logo is its own block with room for its slash */
  .chrome::after { left: -3%; right: -3%; }
  /* press start */
  .start-screen .chrome-sub { margin-top: var(--s3); }
  /* pause / results */
  .pause-screen .card { gap: var(--s2); padding: var(--s4); }
  .paused-h { margin: 0 0 var(--s2) !important; }
  .result-screen { gap: var(--s5); }
  .result-body .kicker { margin-bottom: var(--s1); }
  .result-big { margin: 0 0 var(--s1); }
  .sub { margin: 0 0 var(--s3); }
  .rstats { gap: var(--s2); margin-bottom: var(--s4); }
  /* online */
  .net-body { padding: var(--s2) 0; }
  .net-cards { gap: var(--s3); margin: var(--s3) 0 var(--s4); }
  .net-card { padding: var(--s4) var(--s3); gap: var(--s2); }
  .net-link { gap: var(--s2); margin: var(--s2) 0 var(--s3); }
  .net-code { margin: var(--s2) 0 var(--s3); }
  /* select: header row, then panels, strip, options with clear gaps */
  .select-screen { gap: var(--s2); padding: var(--s2); }
  .sel-top { gap: var(--s4); padding: 0 var(--s1); }
  .prompts { gap: var(--s3); }
  .select-screen .options { padding: var(--s2) var(--s3); gap: var(--s3); }
  /* panel zones: info column on the outside edge, art zone between it and the seam */
  .half { --infoW: min(25%, 300px); --pad: var(--s3); }
  .half .info { top: 44px; bottom: var(--s2); width: var(--infoW); gap: 4px; padding: var(--s2) var(--s3); }
  .half.h0 .info { left: var(--pad); } .half.h1 .info { right: var(--pad); }
  .half .tag { top: var(--s2); }

  /* ================= touch controls (phone-first, own layout) ================= */

  /* ---------------- HUD */

  /* ---------------- title menu: letterboxed band of slanted duotone busts, menu in a dark gap */
  .home { position: fixed; inset: 0; width: 100%; max-height: none; height: 100%; overflow: hidden; padding: 0; background: #000; display: block; --gapW: 36%; --bandT: 8%; --bandB: 10%; --slant: 13vh; }
  .home-top { position: absolute; left: 0; right: 0; top: 0; height: var(--bandT); display: flex; align-items: center; justify-content: space-between; padding: 0 max(var(--s4), env(safe-area-inset-left)); gap: var(--s3); }
  .home-top .prompts { justify-content: flex-start; color: #e9e4d8; font-size: clamp(11px, 1.3vw, 15px); }
  .home-tag { font: 500 clamp(9px, 1vw, 12px) var(--cond); letter-spacing: .4em; color: #5d6f6e; white-space: nowrap; }
  /* The band sits on plain black (the user prefers it); only the menu gap gets a backdrop: a hazy red city. */
  .home-band { position: absolute; left: 0; right: 0; top: var(--bandT); bottom: var(--bandB); }
  /* Slanted panels via clip-path (no skew transforms): the art is a plain cover background of an unskewed box, so it
     always fills its panel at any size and re-lays out cleanly on rotation. Neighbours overlap by the slant. */
  .home-panels { position: absolute; inset: 0 -1%; display: flex; z-index: 1; }
  .tp, .home-gap { clip-path: polygon(var(--slant) 0, 100% 0, calc(100% - var(--slant)) 100%, 0 100%); margin-right: calc(6px - var(--slant)); }
  .home-panels > :last-child { margin-right: 0; }

  .home-panels > :last-child { clip-path: polygon(var(--slant) 0, 100% 0, 100% 100%, 0 100%); }
  .tp { position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; background:
      radial-gradient(circle at 50% 30%, rgba(120,230,215,0.22), transparent 62%),
