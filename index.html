<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#120c18" />
<title>Breakline</title>
<style>
  :root {
    --ink: #f4efe6;
    --dim: #a89fb4;
    --panel: rgba(14, 10, 20, 0.86);
    --edge: #3a2c48;
    --hot: #ff7a3a;
    --p1: #3aa0ff;
    --p2: #ff4a4a;
    --hp: #b4202a;
    --st: #ffd34a;
    --en: #47b8ff;
    --rg: #ff4a1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0710; color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #app canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  #tint { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; background: radial-gradient(ellipse at center, rgba(255,80,20,0.05) 30%, rgba(255,40,0,0.45) 100%); mix-blend-mode: screen; }
  /* ---------------- menus */
  #menu { pointer-events: auto; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(8,6,14,0.55), rgba(8,6,14,0.88)); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #menu.hidden, .hidden { display: none !important; }
  .screen { width: min(1120px, 100% - 32px); max-height: calc(100% - 24px); overflow: auto; padding: 12px 2px; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  .logo { font-family: Impact, "Arial Black", sans-serif; font-size: clamp(56px, 12vw, 120px); letter-spacing: 0.03em; line-height: 0.9; margin: 0; color: var(--ink); text-shadow: 0 6px 30px rgba(255,90,40,0.45); }
  .logo span { color: var(--hot); }
  .tagline { color: var(--dim); margin: 12px 0 28px; font-size: 16px; }
  .focus { outline: 3px solid #fff !important; outline-offset: 2px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* title */
  .title-screen { text-align: center; display: flex; flex-direction: column; align-items: center; }
  .big-btns { display: grid; gap: 12px; width: min(460px, 100%); }
  .bigbtn { display: flex; align-items: center; gap: 16px; text-align: left; padding: 16px 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); transition: transform .1s, background .1s, border-color .1s; }
  .bigbtn:hover, .bigbtn.focus { background: rgba(255,255,255,0.12); transform: translateY(-1px); border-color: rgba(255,255,255,0.3); }
  .bigbtn.primary { background: linear-gradient(135deg, #ff7a3a, #e0402a); border-color: transparent; box-shadow: 0 10px 30px rgba(255,90,40,0.35); }
  .bigbtn .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(0,0,0,0.25); font-size: 20px; flex: none; }
  .bigbtn b { display: block; font-size: 18px; }
  .bigbtn small { display: block; color: rgba(255,255,255,0.75); font-size: 13px; margin-top: 2px; }
  .foot { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  .pill { padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); font-size: 13px; }
  .pill.static { color: var(--dim); }
  .pill:hover { background: rgba(255,255,255,0.12); }
  /* shared */
  .topbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-bottom: 14px; }
  .topbar h2 { margin: 0; text-align: center; font-size: 22px; font-weight: 800; letter-spacing: .02em; }
  .hintline { color: var(--dim); font-size: 14px; }
  .hintline b { color: #fff; }
  .fight.confirm { background: linear-gradient(135deg, #3ac0ff, #2a6ae0); box-shadow: 0 10px 30px rgba(40,140,255,0.35); font-size: 18px; white-space: nowrap; }
  .lockd { color: #7dff9a; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,0.08); color: #ddd; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  kbd { display: inline-block; min-width: 22px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,0.12); border-bottom: 2px solid rgba(0,0,0,0.5); font: 600 12px system-ui; text-align: center; margin: 0 1px; }
  .btn2 { padding: 12px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.07); font-weight: 600; }
  .btn2:hover { background: rgba(255,255,255,0.14); }
  .btn2.primary { background: linear-gradient(135deg, #ff7a3a, #e0402a); border-color: transparent; }
  .btn2.wide { width: 100%; }
  /* fighter select */
  .select-grid { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: 14px; align-items: stretch; }
  .side { position: relative; border-radius: 18px; padding: 14px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, transparent), rgba(255,255,255,0.03)); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; overflow: hidden; }
  .side.active { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 10px 40px color-mix(in srgb, var(--c) 35%, transparent); }
  .side-who { display: flex; justify-content: space-between; align-items: center; }
  .badge { font: 800 12px system-ui; padding: 3px 8px; border-radius: 6px; color: #000; }
  .badge.p0 { background: var(--p1); } .badge.p1 { background: var(--p2); }
  .choosing { font-size: 12px; color: var(--c); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }
  .side-art { position: relative; height: clamp(150px, 30vh, 290px); overflow: hidden; }
  .side-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 12px 18px rgba(0,0,0,0.6)); }
  .side-img.ini, .pimg.ini, .rimg.ini, .mini.ini, .result-img.ini { display: grid; place-items: center; width: 100%; height: 100%; font: 900 64px Impact, sans-serif; color: var(--c); }
  .side-name { font: 900 30px Impact, "Arial Black", sans-serif; letter-spacing: .03em; color: var(--c); margin-top: 6px; }
  .side-title { color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: .1em; }
  .trait { font-size: 12px; line-height: 1.35; color: var(--dim); margin: 6px 0 2px; max-width: 280px; } .trait b { color: var(--c); }
  .stats { margin-top: 10px; display: grid; gap: 6px; }
  .stat { display: grid; grid-template-columns: 82px 1fr; align-items: center; font-size: 12px; color: #ccc; }
  .stat i { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .stat b { height: 7px; border-radius: 3px; background: rgba(255,255,255,0.1); }
  .stat b.on { background: var(--c); }
  .roster { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-content: start; }
  .rcard { position: relative; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 30%, #111), #0d0b12); padding: 6px 4px 8px; height: clamp(120px, 19vh, 170px); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; overflow: hidden; transition: transform .1s; }
  .rcard:hover, .rcard.focus { transform: translateY(-2px); border-color: var(--c); }
  .rimg { position: absolute; inset: 4px 0 26px; width: 100%; height: calc(100% - 30px); object-fit: contain; object-position: center bottom; }
  .rname { position: relative; font: 900 14px Impact, "Arial Black", sans-serif; letter-spacing: .04em; text-shadow: 0 2px 6px #000; }
  .rtags { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; }
  .rtags i { font: 800 11px system-ui; padding: 2px 6px; border-radius: 5px; color: #000; font-style: normal; }
  .rtags .t1 { background: var(--p1); } .rtags .t2 { background: var(--p2); }
  .rcard.pick1 { box-shadow: inset 0 0 0 2px var(--p1); }
  .rcard.pick2 { box-shadow: inset 0 0 0 2px var(--p2); }
  .rcard.pick1.pick2 { box-shadow: inset 0 0 0 2px var(--p1), inset 0 0 0 4px var(--p2); }
  .blurb { grid-column: 1 / -1; margin: 2px 4px 0; color: #cfc8d8; font-size: 13px; line-height: 1.4; text-align: center; }
  .options { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-top: 16px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
  .opt { display: flex; align-items: center; gap: 10px; }
  .opt-label { color: var(--dim); font-size: 13px; }
  .seg { display: inline-flex; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 3px; gap: 3px; }
  .segbtn { padding: 8px 12px; border-radius: 9px; border: 0; background: transparent; font-size: 14px; color: #cfc8d8; display: flex; align-items: center; gap: 8px; }
  .segbtn.on { background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; }
  .arena-sw { width: 22px; height: 16px; border-radius: 4px; display: inline-block; }
  .arena-sw.rooftop { background: linear-gradient(180deg, #6a4a70, #ffc890); }
  .arena-sw.overpass { background: linear-gradient(180deg, #8fb4bc, #3a4a4c); }
  .fight { margin-left: auto; padding: 14px 34px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #ff7a3a, #e0402a); font: 900 22px Impact, "Arial Black", sans-serif; letter-spacing: .06em; box-shadow: 0 10px 30px rgba(255,90,40,0.4); }
  /* results */
  .result-screen { display: grid; grid-template-columns: minmax(180px, 34%) 1fr; gap: 24px; align-items: center; }
  .result-art { position: relative; height: min(62vh, 520px); background: radial-gradient(ellipse at 50% 80%, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%); }
  .result-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 16px 24px rgba(0,0,0,0.7)); }
  .kicker { margin: 0; color: var(--c); font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
  .result-big { font: 900 clamp(44px, 8vw, 84px) Impact, "Arial Black", sans-serif; margin: 4px 0; line-height: 1; }
  .sub { color: var(--dim); margin: 0 0 18px; }
  .rstats { display: grid; gap: 8px; margin-bottom: 18px; }
  .rstat { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border-left: 4px solid var(--c); }
  .rstat b { display: block; } .rstat span { color: var(--dim); font-size: 13px; }
  .mini { width: 44px; height: 54px; object-fit: cover; object-position: 50% 10%; border-radius: 8px; background: rgba(0,0,0,0.3); flex: none; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
  /* pause */
  .pause-screen { display: grid; place-items: center; }
  .pause-screen .card { width: min(360px, 100%); display: grid; gap: 10px; padding: 22px; border-radius: 20px; background: rgba(20,16,28,0.9); border: 1px solid rgba(255,255,255,0.1); }
  .pause-screen h2 { margin: 0 0 6px; text-align: center; font-size: 26px; }
  /* how to play */
  .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
  .tab { padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: transparent; font-weight: 600; }
  .tab.on { background: #fff; color: #111; }
  table.ctl { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.ctl th { text-align: left; color: var(--dim); font-weight: 600; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  table.ctl td { padding: 9px 8px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .note { color: var(--dim); font-size: 13px; margin-top: 12px; line-height: 1.6; }
  .tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .tip { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.05); }
  .tip h4 { margin: 0 0 6px; font-size: 15px; } .tip p { margin: 0; color: #cfc8d8; font-size: 13.5px; line-height: 1.55; }
  .fcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
  .fcard { padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.05); border-top: 3px solid var(--c); }
  .fhead { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .fhead b { display: block; color: var(--c); font: 900 18px Impact, sans-serif; letter-spacing: .04em; } .fhead span { color: var(--dim); font-size: 12px; }
  table.mlist { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.mlist td { padding: 4px 4px; vertical-align: top; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ddd; }
  table.mlist td:first-child { color: var(--c); font-weight: 700; white-space: nowrap; }
  /* Short screens (phones in landscape): compact select layout. */
  @media (max-height: 560px) {
    .screen { padding: 6px 2px; }
    .topbar { margin-bottom: 8px; } .topbar h2 { font-size: 18px; }
    .side { padding: 8px 10px; }
    .side-art { height: 26vh; }
    .side-name { font-size: 20px; margin-top: 2px; }
    .chips, .blurb { display: none; }
    .side-title { font-size: 10px; }
    .stats { margin-top: 4px; gap: 2px; }
    .stat { grid-template-columns: 62px 1fr; font-size: 10px; }
    .stat b { height: 5px; }
    .trait { font-size: 10px; line-height: 1.25; margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rcard { height: 27vh; }
    .options { margin-top: 6px; padding: 6px 8px; gap: 8px; flex-wrap: nowrap; }
    .opt-label, .arena-sw { display: none; }
    .segbtn { padding: 6px 8px; font-size: 12px; }
    .fight { padding: 8px 18px; font-size: 16px; white-space: nowrap; }
    .side-art { height: 17vh; }
    .rcard { height: 25vh; }
    .result-art { height: 70vh; }
    .result-big { font-size: 48px; }
    .logo { font-size: 64px; } .tagline { margin: 6px 0 14px; }
    .bigbtn { padding: 10px 14px; } .bigbtn .ico { width: 36px; height: 36px; }
    .bigbtn small { display: none; } .big-btns { gap: 8px; } .foot { margin-top: 12px; }
  }
  @media (max-width: 820px) and (orientation: portrait) {
    .select-grid { grid-template-columns: 1fr 1fr; }
    .roster { grid-column: 1 / -1; grid-row: 1; grid-template-columns: repeat(4, 1fr); }
    .rcard { height: 120px; }
    .blurb { display: none; }
    .side-art { height: 140px; }
    .stats { display: none; }
    .result-screen { grid-template-columns: 1fr; }
    .result-art { height: 200px; }
    .fight { width: 100%; margin-left: 0; }
  }
  /* ---------------- HUD */
  #hud { font-weight: 700; }
  .hud-p { position: absolute; top: max(10px, env(safe-area-inset-top)); display: flex; gap: 6px; align-items: flex-start; width: min(320px, 42vw); }
  .hud-p.p0 { left: 12px; }
  .hud-p.p1 { right: 12px; flex-direction: row-reverse; }
  .por { position: relative; flex: 0 0 46px; height: 52px; background: linear-gradient(160deg, var(--c), #111 85%); border: 2px solid #000; box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset, 2px 2px 0 #000; overflow: hidden; }
  .por { background-size: 230%; background-position: 50% 8%; background-repeat: no-repeat; }
  .por .ini { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 34px Impact, "Arial Black", sans-serif; color: #fff; text-shadow: 2px 2px 0 #000; transform: skew(-8deg); }
  .por::after { content: ''; position: absolute; left: -10px; right: -10px; top: 58%; height: 3px; background: rgba(0,0,0,0.6); transform: rotate(-24deg); }
  .por .tag { position: absolute; bottom: 0; left: 0; font-size: 9px; padding: 0 3px; background: var(--p1); color: #000; z-index: 2; }
  .p1 .por .tag { background: var(--p2); left: auto; right: 0; }
  .meters { flex: 1; min-width: 0; }
  .pips { display: flex; gap: 3px; align-items: center; height: 10px; }
  .p1 .pips { flex-direction: row-reverse; }
  .pips b { position: relative; flex: 0 0 18%; height: 6px; background: #050508; border: 1px solid #000; box-shadow: 0 0 0 1px rgba(110,220,255,0.25); transform: skew(-20deg); overflow: hidden; }
  .pips b i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(180deg, #c8f4ff, #39b4e8); }
  .p1 .pips b i { left: auto; right: 0; }
  .pips.unlimited b i { background: linear-gradient(180deg, #fff0b0, #ff5a1c); }
  .pips.flash b { box-shadow: 0 0 0 1px #ff3030; background: #400; }
  .pips .nm { margin: 0 6px; font-size: 12px; letter-spacing: 0.06em; white-space: nowrap; text-shadow: 1px 1px 0 #000; }
  .bar { position: relative; height: 8px; background: #050508; margin-top: 4px; overflow: hidden; border: 1px solid #000; transform: skew(-20deg); box-shadow: 1px 1px 0 rgba(0,0,0,0.6); }
  .bar.vit { height: 8px; }
  .bar > div, .bar .fill { position: absolute; top: 0; bottom: 0; left: 0; transition: width .12s linear; }
  .hud-p.p1 .bar > div, .hud-p.p1 .bar .fill { right: 0; left: auto; }
  .bar .hp { background: linear-gradient(180deg, #ff6a6a, var(--hp)); }
  .bar .st { background: linear-gradient(180deg, #d0fff8, #4fd8c8); }
  .bar.rg { height: 4px; margin-top: 3px; }
  .bar.rg .fill { background: linear-gradient(180deg, #ffb080, var(--rg)); }
  .bar.rg.ready .fill { animation: pulse .4s infinite alternate; }
  .bar.rg.on .fill { background: linear-gradient(90deg, #ff2000, #ffd040, #ff2000); background-size: 200% 100%; animation: slide .5s linear infinite; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.8); } }
  @keyframes slide { to { background-position: 200% 0; } }
  .flags { display: flex; gap: 5px; margin-top: 4px; min-height: 16px; font-size: 11px; align-items: center; flex-wrap: wrap; }
  .p1 .flags { flex-direction: row-reverse; }
  .flags span { padding: 0 5px; line-height: 15px; letter-spacing: .08em; transform: skew(-10deg); }
  .flags .danger { background: #ffd34a; color: #a00; border: 1px solid #000; }
  .flags .rage { background: #e02010; color: #fff; border: 1px solid #000; }
  .flags .fin { background: #111; color: #fff; border: 1px solid #ffd34a; }
  .flags kbd { font: inherit; background: #c02020; color: #fff; padding: 0 3px; border-radius: 2px; }
  .flags .note { color: #ffe0a0; text-shadow: 1px 1px 0 #000; transform: none; }
  .ctl { color: var(--dim); font-size: 10px; font-weight: 400; margin-top: 1px; }
  .p1 .ctl { text-align: right; }
  #hud.menu-up .hud-center, #hud.menu-up .keys { display: none; }
  .hud-center { position: absolute; top: 28%; left: 0; right: 0; text-align: center; }
  .hud-big { font-family: Impact, "Arial Black", sans-serif; font-size: clamp(44px, 12vw, 120px); letter-spacing: 0.04em; transform: skew(-8deg); text-shadow: 5px 5px 0 #000, 0 0 30px rgba(255,120,40,.6); }
  .hud-big.end.finisher { color: #ffd34a; }
  .hud-big.end.ringout { color: #7ad0ff; }
  .hud-big.end.ko { color: #ff5a4a; }
  .hud-sub { font-size: clamp(16px, 3vw, 26px); letter-spacing: .15em; text-shadow: 2px 2px 0 #000; margin-top: 6px; }
  .keys { position: absolute; bottom: 10px; left: 12px; font-size: 11px; color: var(--dim); background: rgba(10,7,14,.7); padding: 6px 8px; border: 1px solid var(--edge); font-weight: 400; max-width: calc(100% - 24px); }
  #perf { position: absolute; right: 12px; bottom: 10px; font: 11px monospace; color: #9f9; background: rgba(0,0,0,.6); padding: 4px 6px; white-space: pre; }
  #toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 2px solid var(--hot); padding: 8px 14px; font-weight: 700; z-index: 30; transition: opacity .3s; opacity: 0; pointer-events: none; }
  /* ---------------- touch */
  #touch { pointer-events: none; z-index: 20; }
  #touch .tstick { pointer-events: auto; position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: 28px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); }
  #touch .tknob { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.35); }
  #touch .tbtns { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: 18px; width: 250px; height: 230px; }
  #touch .tb { pointer-events: auto; position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); background: rgba(30,20,40,0.55); color: #fff; font: 700 18px system-ui; padding: 0; }
  #touch .tb.on { background: rgba(255,122,58,0.7); }
  #touch .tb small { display: block; font-size: 9px; font-weight: 400; }
  #touch .ta { right: 70px; bottom: 0; background: rgba(40,120,60,0.6); }
  #touch .tbb { right: 0; bottom: 50px; background: rgba(160,40,40,0.6); }
  #touch .tx { right: 140px; bottom: 40px; }
  #touch .ty { right: 70px; bottom: 80px; }
  #touch .tl { right: 180px; bottom: 140px; border-radius: 12px; width: 64px; height: 44px; }
