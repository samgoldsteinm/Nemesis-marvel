<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#120c18" />
<title>Breakline</title>
<style>
  :root {
    --ink: #f4efe6;
    --dim: #a89fb4;
    --panel: rgba(14, 10, 20, 0.86);
    --edge: #3a2c48;
    --hot: #ff7a3a;
    --p1: #3aa0ff;
    --p2: #ff4a4a;
    --hp: #b4202a;
    --st: #ffd34a;
    --en: #47b8ff;
    --rg: #ff4a1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0710; color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #app canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  /* ---------------- menus */
  #menu { pointer-events: auto; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, rgba(60,20,40,0.55), rgba(8,5,12,0.92)); }
  #menu.hidden, .hidden { display: none !important; }
  .screen { width: min(980px, 100% - 32px); max-height: calc(100% - 24px); overflow: auto; padding: 8px 0; }
  .logo { font-family: Impact, "Arial Black", sans-serif; font-size: clamp(48px, 11vw, 112px); letter-spacing: 0.04em; line-height: 0.9; margin: 0; color: var(--ink); text-shadow: 4px 4px 0 #000, 0 0 30px rgba(255,90,40,0.55); transform: skew(-6deg); }
  .logo span { color: var(--hot); }
  .tagline { color: var(--dim); margin: 10px 0 26px; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
  .btns { display: flex; flex-direction: column; gap: 10px; max-width: 380px; }
  .btn { pointer-events: auto; font: inherit; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); background: linear-gradient(180deg, #2a1f36, #1a1222); border: 2px solid var(--edge); border-left: 6px solid var(--hot); padding: 12px 16px; text-align: left; cursor: pointer; transform: skew(-6deg); transition: transform .08s, background .08s; }
  .btn:hover, .btn.focus { background: linear-gradient(180deg, #4a2a3a, #2b1828); border-color: var(--hot); transform: skew(-6deg) translateX(6px); }
  .btn small { display: block; color: var(--dim); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12px; margin-top: 2px; }
  h2 { font-family: Impact, "Arial Black", sans-serif; letter-spacing: 0.05em; font-size: 34px; margin: 4px 0 12px; transform: skew(-6deg); text-shadow: 3px 3px 0 #000; }
  .hint { color: var(--dim); font-size: 13px; margin-top: 14px; }
  .roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .card { pointer-events: auto; cursor: pointer; background: var(--panel); border: 2px solid var(--edge); padding: 12px; position: relative; min-height: 190px; }
  .card.focus, .card:hover { border-color: var(--c, var(--hot)); box-shadow: 0 0 0 2px var(--c, var(--hot)) inset, 0 0 24px rgba(0,0,0,0.6); }
  .card .cn { font-family: Impact, "Arial Black", sans-serif; font-size: 28px; color: var(--c); letter-spacing: 0.04em; }
  .card .ct { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
  .card p { font-size: 13px; margin: 8px 0; line-height: 1.35; }
  .card .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 11px; padding: 2px 6px; border: 1px solid var(--edge); color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .card .pick { position: absolute; top: 8px; right: 8px; font-weight: 800; font-size: 12px; padding: 2px 6px; }
  .pick.p1 { background: var(--p1); color: #000; }
  .pick.p2 { background: var(--p2); color: #000; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
  .row .btn { flex: 0 0 auto; }
  .seg { display: inline-flex; gap: 0; }
  .seg .btn { border-left-width: 2px; padding: 8px 12px; }
  .seg .btn.on { background: #5a2a30; border-color: var(--hot); }
  table.moves { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.moves td { border-bottom: 1px solid var(--edge); padding: 6px 8px; vertical-align: top; }
  table.moves td:first-child { color: var(--hot); font-weight: 700; white-space: nowrap; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .result-big { font-family: Impact, "Arial Black", sans-serif; font-size: clamp(40px, 9vw, 80px); transform: skew(-6deg); text-shadow: 4px 4px 0 #000; margin: 0; }
  /* ---------------- HUD */
  #hud { font-weight: 700; }
  .hud-p { position: absolute; top: max(10px, env(safe-area-inset-top)); width: min(420px, 44vw); background: var(--panel); border: 2px solid var(--edge); padding: 6px 8px 8px; }
  .hud-p.p0 { left: 12px; border-left: 5px solid var(--p1); }
  .hud-p.p1 { right: 12px; border-right: 5px solid var(--p2); }
  .hud-p.p1 .hud-name, .hud-p.p1 .flags { flex-direction: row-reverse; }
  .hud-p.p1 .bar > div, .hud-p.p1 .bar .fill { right: 0; left: auto; }
  .hud-name { display: flex; gap: 8px; align-items: baseline; font-size: 15px; letter-spacing: 0.05em; }
  .hud-name .tag { font-size: 11px; padding: 1px 5px; background: var(--p1); color: #000; }
  .p1 .hud-name .tag { background: var(--p2); }
  .hud-name .ctl { color: var(--dim); font-size: 11px; font-weight: 400; }
  .bar { position: relative; height: 10px; background: #000; margin-top: 5px; overflow: hidden; border: 1px solid #000; }
  .bar.vit { height: 16px; }
  .bar > div, .bar .fill { position: absolute; top: 0; bottom: 0; left: 0; transition: width .12s linear; }
  .bar .hp { background: repeating-linear-gradient(135deg, var(--hp), var(--hp) 6px, #8a1820 6px, #8a1820 12px); }
  .bar .st { background: linear-gradient(180deg, #fff3a8, var(--st)); }
  .bar.en .fill { background: linear-gradient(180deg, #a8e2ff, var(--en)); }
  .bar.en .fill.low { background: linear-gradient(180deg, #7090a8, #405868); }
  .bar.en .fill.flash { background: #ff3030; }
  .bar.en i { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(0,0,0,0.8); z-index: 2; }
  .bar.en i:first-of-type { width: 3px; background: #fff; opacity: 0.7; }
  .bar.rg .fill { background: linear-gradient(180deg, #ffb080, var(--rg)); }
  .bar.rg { height: 12px; }
  .bar.rg.ready .fill { animation: pulse .4s infinite alternate; }
  .bar.rg.on .fill { background: linear-gradient(90deg, #ff2000, #ffd040, #ff2000); background-size: 200% 100%; animation: slide .5s linear infinite; }
  .rlabel { position: absolute; inset: 0; font-size: 9px; line-height: 12px; padding: 0 4px; color: #fff; text-shadow: 1px 1px 0 #000; z-index: 2; letter-spacing: .08em; }
  .p1 .rlabel { text-align: right; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.8); } }
  @keyframes slide { to { background-position: 200% 0; } }
  .flags { display: flex; gap: 8px; margin-top: 5px; min-height: 18px; font-size: 12px; align-items: center; }
  .flags .danger { background: #e01020; color: #fff; padding: 1px 6px; letter-spacing: .1em; }
  .flags .fin { background: #ffd34a; color: #000; padding: 1px 6px; }
  .flags .note { color: #ffe0a0; text-shadow: 1px 1px 0 #000; }
  #hud.menu-up .hud-center, #hud.menu-up .keys { display: none; }
  .hud-center { position: absolute; top: 28%; left: 0; right: 0; text-align: center; }
  .hud-big { font-family: Impact, "Arial Black", sans-serif; font-size: clamp(44px, 12vw, 120px); letter-spacing: 0.04em; transform: skew(-8deg); text-shadow: 5px 5px 0 #000, 0 0 30px rgba(255,120,40,.6); }
  .hud-big.end.finisher { color: #ffd34a; }
  .hud-big.end.ringout { color: #7ad0ff; }
  .hud-big.end.ko { color: #ff5a4a; }
  .hud-sub { font-size: clamp(16px, 3vw, 26px); letter-spacing: .15em; text-shadow: 2px 2px 0 #000; margin-top: 6px; }
  .keys { position: absolute; bottom: 10px; left: 12px; font-size: 11px; color: var(--dim); background: rgba(10,7,14,.7); padding: 6px 8px; border: 1px solid var(--edge); font-weight: 400; max-width: calc(100% - 24px); }
  #perf { position: absolute; right: 12px; bottom: 10px; font: 11px monospace; color: #9f9; background: rgba(0,0,0,.6); padding: 4px 6px; white-space: pre; }
  #toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 2px solid var(--hot); padding: 8px 14px; font-weight: 700; z-index: 30; transition: opacity .3s; opacity: 0; pointer-events: none; }
  /* ---------------- touch */
  #touch { pointer-events: none; z-index: 20; }
  #touch .tstick { pointer-events: auto; position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: 28px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); }
  #touch .tknob { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.35); }
  #touch .tbtns { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: 18px; width: 250px; height: 230px; }
  #touch .tb { pointer-events: auto; position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); background: rgba(30,20,40,0.55); color: #fff; font: 700 18px system-ui; padding: 0; }
  #touch .tb.on { background: rgba(255,122,58,0.7); }
  #touch .tb small { display: block; font-size: 9px; font-weight: 400; }
  #touch .ta { right: 70px; bottom: 0; background: rgba(40,120,60,0.6); }
  #touch .tbb { right: 0; bottom: 50px; background: rgba(160,40,40,0.6); }
  #touch .tx { right: 140px; bottom: 40px; }
  #touch .ty { right: 70px; bottom: 80px; }
  #touch .tl { right: 180px; bottom: 140px; border-radius: 12px; width: 64px; height: 44px; }
  #touch .tr { right: 0; bottom: 140px; border-radius: 12px; width: 64px; height: 44px; }
  #touch .tchord { width: 64px; height: 44px; border-radius: 12px; font-size: 13px; }
  #touch .tc1 { right: 90px; bottom: 160px; }
  #touch .tc2 { right: 0; bottom: 196px; }
  #touch .tpause { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); width: 44px; height: 34px; border-radius: 8px; font-size: 14px; }
  #touch.off { display: none; }
  @media (max-width: 700px) {
    .hud-p { width: calc(50% - 16px); padding: 4px 6px 6px; }
    .hud-name { font-size: 12px; }
    .hud-name .ctl { display: none; }
    .keys { display: none; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="hud" class="layer"></div>
  <div id="touch" class="layer off"></div>
  <div id="menu" class="layer"></div>
  <div id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
